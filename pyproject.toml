[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-codesift"
dynamic = ["version"]
description = "Screening harness for locally hosted coding models served by Ollama"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["ollama", "llm", "benchmark", "evaluation", "local-models", "coding"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
codesift = "codesift.cli:main"

[project.urls]
Homepage = "https://github.com/aschet/llm-codesift"
Issues = "https://github.com/aschet/llm-codesift/issues"

# Single source of truth: the version lives in the package and hatchling reads it.
[tool.hatch.version]
path = "src/codesift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codesift"]

[tool.hatch.build.targets.sdist]
include = ["src/codesift", "tests", "README.md", "LICENSE", "pyproject.toml"]
